 const S=SYS[st.sys],a=E=>Math.exp(-E/EQ_R*(1/st.T-1/EQ_T0)),c=st.cat?3:1;
 return {kf:S.kf*a(S.Ef)*c,kr:S.kr*a(S.Er)*c}}

 return {f:k.kf*eqCount(st,S.R)/Math.pow(st.V,S.R.length-1),r:k.kr*eqCount(st,S.P)/Math.pow(st.V,S.P.length-1)}}

  ema:{f:0,r:0},hist:[],marks:[],flashes:[],evF:0,evR:0,accF:0,accR:0,x:{}};
 Object.keys(S.sp).forEach(s=>st.n[s]=0);
 const start=o.start||S.start||{[S.R[0]]:S.total};
 for(const s in start)for(let i=0;i<start[s];i++)eqSpawn(st,s);
 Object.keys(S.sp).forEach(s=>st.x[s]=st.n[s]);const r=eqRates(st);st.ema={f:r.f,r:r.r};return st}

 else{if(S.total)start={[S.P[0]]:S.total*2};else{const n=Math.min(...S.R.map(k=>S.start[k]));start={[S.P[0]]:S.P.length===2?n*2:n};S.R.forEach(k=>{if(S.start[k]>n)start[k]=S.start[k]-n})}}
 return start}
function term([c,k,ph]){const S=SYS[sys],sp=S.sp[k];return `${c>1?c+' ':''}${sp?`<span class="sw" style="background:${sp.c};border-color:${sp.e}"></span>`:''}${S.sp[k]?S.sp[k].l:{H2O:'H₂O'}[k]||k}(${ph})`}
const KEYS_EQ='Keys: Space pause · 1–4 the change buttons · ← → temperature · R back to balance · F full screen';
function setupRide(){
 $('eqline').innerHTML=`🧍 Guests in line ⇌ 🎢 Guests on the ride<span class="dh">(reactants ⇌ products)</span>`;
 $('real').textContent='Theme-park model: boarding = forward reaction, coming back to the line = reverse reaction. Follow the gold ⭐ guest: nobody is ever stuck.';
 $('stress').innerHTML=RIDE_STRESS.map(([k,l,tog],i)=>`<button type="button" class="big${tog?'':' go'}" data-s="${k}" aria-keyshortcuts="${i+1}"${tog?' aria-pressed="false"':''}>${esc(l)}</button>`).join('');
 $('tWrap').hidden=$('vWrap').hidden=$('catBtn').hidden=true;
 $('ratesH').textContent='Guests per minute';$('fL').textContent='Boarding';$('rL').textContent='Back in line';
 $('counts').innerHTML='<h2>Guests</h2>'+[['q','In line',RC.q],['r','On the ride',RC.r]].map(([k,l,c])=>`<div class="bar"><span><span class="sw" style="background:${c};border-color:${c}"></span>${l}</span><div class="track"><div class="fill" data-c="${k}" style="background:${c}"></div></div><b data-n="${k}">0</b></div>`).join('');
 $('grH').textContent='Line and ride over time (last 30 s)';
 document.querySelector('[data-r="R"]').textContent='↺ Everyone in line';document.querySelector('[data-r="P"]').textContent='↺ Everyone on the ride';
 $('keys').textContent='Keys: Space pause · 1 tour bus · 2 fireworks · 3 extra crew · 4 longer ride · R back to balance · F full screen';
 $('cv').setAttribute('aria-label','Theme park: a line of guests on the left and a ride loop on the right');
 st=rideFresh();maxN=1;status=''}
function setup(){
 $('systems').innerHTML=ORDER.map(([k,l])=>`<button type="button" class="sys" data-sys="${k}" aria-pressed="${k===sys}">${l}</button>`).join('');
 try{const u=new URL(location.href);u.searchParams.set('sys',sys);history.replaceState(null,'',u)}catch(e){}
 lastSample=-1;
 if(RIDEMODE())return setupRide();
 const S=SYS[sys];
 $('catBtn').hidden=false;$('ratesH').textContent='Reaction rates';$('fL').textContent='Forward';$('rL').textContent='Reverse';$('grH').textContent='Amount over time (last 30 s)';
 document.querySelector('[data-r="R"]').textContent='↺ Reactants only';document.querySelector('[data-r="P"]').textContent='↺ Products only';$('keys').textContent=KEYS_EQ;
 const dh=S.dH==null?'':S.dH>0?`<span class="dh">ΔH &gt; 0 (endothermic)</span>`:`<span class="dh">ΔH &lt; 0 (exothermic)</span>`;
 $('eqline').innerHTML=`${S.eq.map(term).join(' + ')} ⇌ ${S.eqP.map(term).join(' + ')}${dh}`;
 $('real').textContent=S.real||'';
 $('stress').innerHTML=S.stress.map(([k,l],i)=>`<button type="button" class="big go" data-s="${k}" aria-keyshortcuts="${i+1}">${esc(l)}</button>`).join('');
 $('tWrap').hidden=!S.heat;$('vWrap').hidden=!S.gas;
 $('counts').innerHTML='<h2>Particles</h2>'+Object.keys(S.sp).map(k=>`<div class="bar"><span><span class="sw" style="background:${S.sp[k].c};border-color:${S.sp[k].e}"></span>${S.sp[k].l}</span><div class="track"><div class="fill" data-c="${k}" style="background:${S.sp[k].e}"></div></div><b data-n="${k}">0</b></div>`).join('');
 $('cv').setAttribute('aria-label','Particle view: '+S.title);
 st=fresh();maxN=1;status='';$('tSl').value=25;$('tOut').textContent='25 °C';$('vSl').value=70;$('vOut').textContent='70%';
 $('catBtn').setAttribute('aria-pressed','false')}
function fit(cv,w,h){const dpr=window.devicePixelRatio||1,cw=cv.clientWidth||w,want=Math.round(cw*dpr);if(cv.width!==want){cv.width=want;cv.height=Math.round(want*h/w)}const c=cv.getContext('2d');c.setTransform(cv.width/w,0,0,cv.height/h,0,0);return c}
function draw(){const lw=LW(),lh=LH(),cv=$('cv');cv.style.aspectRatio=lw+'/'+lh;const ctx=fit(cv,lw,lh);
 if(RIDEMODE()){ctx.clearRect(0,0,lw,lh);drawPark(ctx);const t=[st.crew?'👷 extra crew':'',st.long?'⏱️ longer ride':'',paused?'paused':''].filter(Boolean).join(' · ');$('stamp').textContent=t;$('stamp').hidden=!t;return}
 $('stamp').hidden=false;const S=SYS[sys],W=eqW(st);
 ctx.clearRect(0,0,lw,H0);const tc=st.T-273,warm=Math.max(0,Math.min(1,(tc-25)/75)),cold=Math.max(0,Math.min(1,(25-tc)/25));
 ctx.fillStyle=`rgb(${250-cold*20},${251-warm*12-cold*4},${255-warm*30})`;ctx.fillRect(0,0,W,H0);
 const tn=(st.x[S.tint.sp]??st.n[S.tint.sp])/st.V;let al,rgb;
 if(S.tint.mix){const f=Math.max(0,Math.min(1,(tn-S.tint.lo)/(S.tint.hi-S.tint.lo)));rgb=S.tint.mix[0].map((v,i)=>Math.round(v+(S.tint.mix[1][i]-v)*f));al=S.tint.a}else{rgb=S.tint.rgb;al=Math.min(S.tint.max,tn*S.tint.k)}
 ctx.fillStyle=`rgba(${rgb.join(',')},${al*0.45})`;ctx.fillRect(0,0,W,H0);
 if(S.gas){ctx.fillStyle='#dfe5ea';ctx.fillRect(W,0,lw-W,H0);ctx.fillStyle='#8696a3';ctx.fillRect(W,0,8,H0);ctx.fillRect(W+8,H0/2-6,lw-W,12)}
 for(const p of st.parts){const sh=SHAPES[p.s];p.a=(p.a??(p.x*7%6.28))+(paused?0:(p.vx>0?0.01:-0.01));const ca=Math.cos(p.a),sa=Math.sin(p.a);
  for(const [dx,dy,r,f,e,kind] of sh){const x=p.x+(dx*ca-dy*sa)*DRAW,y=p.y+(dx*sa+dy*ca)*DRAW;ctx.beginPath();ctx.arc(x,y,r*DRAW,0,7);ctx.fillStyle=f;ctx.fill();ctx.lineWidth=kind==='cell'?2.6:1.8;ctx.strokeStyle=e;ctx.stroke();
   if(kind==='cell'){ctx.beginPath();ctx.arc(x,y,r*DRAW*0.48,0,7);ctx.fillStyle='rgba(255,255,255,0.26)';ctx.fill();ctx.lineWidth=1.2;ctx.strokeStyle='rgba(0,0,0,0.14)';ctx.stroke()}}}
 for(const f of st.flashes){const k=Math.max(0,Math.min(1,(st.t-f.t)/0.45));ctx.beginPath();ctx.arc(f.x,f.y,8+k*20,0,7);ctx.strokeStyle=f.dir>0?`rgba(31,138,76,${1-k})`:`rgba(194,90,18,${1-k})`;ctx.lineWidth=3.5;ctx.setLineDash(f.dir>0?[]:[6,5]);ctx.stroke();ctx.setLineDash([])}
 $('stamp').textContent=`${tc.toFixed(0)} °C${S.gas?' · V '+Math.round(st.V*100)+'%':''}${st.cat?' · catalyst on':''}${paused?' · paused':''}`}
function counts(){return RIDEMODE()?{q:st.queue.length,r:st.ride.length}:st.n}
function readout(){const ride=RIDEMODE(),S=SYS[sys],f=st.ema.f,r=st.ema.r,m=Math.max(f,r,0.5),n=counts();
 $('fF').style.width=(100*f/m)+'%';$('fR').style.width=(100*r/m)+'%';$('fN').textContent=f.toFixed(1);$('rN').textContent=r.toFixed(1);
 for(const k in n)maxN=Math.max(maxN,n[k]);
 for(const k in n){const b=document.querySelector(`[data-n="${k}"]`),fl=document.querySelector(`[data-c="${k}"]`);if(b)b.textContent=n[k];if(fl)fl.style.width=(100*n[k]/maxN)+'%'}
 const bal=Math.abs(f-r)<0.12*Math.max(f,r)+0.08,want=bal?'eq':f>r?'fwd':'rev';
 if(want!==status){status=want;const el=$('status');el.className='status card '+want;
  if(ride){el.textContent=want==='eq'?'⚖️ Balanced: boarding = back in line':want==='fwd'?'➡️ Shifting toward the ride':'⬅️ Shifting back toward the line';return}
  const P=S.eqP.filter(e=>S.sp[e[1]]).map(e=>S.sp[e[1]].l).join(' + '),R=S.eq.filter(e=>S.sp[e[1]]).map(e=>S.sp[e[1]].l).join(' + ');
  el.textContent=want==='eq'?'⚖️ Balanced: forward = reverse':want==='fwd'?`➡️ Shifting forward, making ${P}`:`⬅️ Shifting back, making ${R}`}}
function graph(){const ride=RIDEMODE(),cv=$('gr'),w=600,h=240,ctx=fit(cv,w,h),H=st.hist;ctx.clearRect(0,0,w,h);if(H.length<2)return;
 const ks=ride?['q','r']:Object.keys(SYS[sys].sp),col=k=>{if(ride)return k==='q'?RC.gq:RC.gr;const e=SYS[sys].sp[k].e;return e==='#9c8456'?'#b49a62':e};let mx=1;for(const p of H)for(const k of ks)mx=Math.max(mx,p.c[k]);const t1=st.t,t0=t1-30,X=t=>(t-t0)/30*(w-20)+10,Y=v=>h-12-(v/mx)*(h-24);
 ctx.strokeStyle='#e3e8f0';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=12+i*(h-24)/4;ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(w-10,y);ctx.stroke()}
 let lastX=-1e9,row=0;for(const m of st.marks){if(m.t<t0)continue;const mx0=X(m.t);row=mx0-lastX<170?(row+1)%3:0;lastX=mx0;ctx.strokeStyle='#8a94a8';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(X(m.t),8);ctx.lineTo(X(m.t),h-8);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#4b566e';ctx.font='800 15px Nunito,system-ui,sans-serif';ctx.fillText(m.label,X(m.t)+5,22+row*18)}
 for(const k of ks){ctx.strokeStyle=col(k);ctx.lineWidth=4;ctx.beginPath();H.forEach((p,i)=>{const x=X(p.t),y=Y(p.c[k]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}}
function loop(now){raf=requestAnimationFrame(loop);if(document.hidden)return;const dt=Math.min(0.05,(now-last)/1000)*speed;last=now;
 if(!paused&&dt>0){const ride=RIDEMODE();if(ride)rideTick(dt);else eqStep(st,dt);
  if(st.t-lastSample>=0.2||lastSample<0){lastSample=st.t;const c={};if(ride){c.q=st.xq;c.r=st.xr}else for(const k in SYS[sys].sp)c[k]=st.x[k]/st.V;st.hist.push({t:st.t,c});while(st.hist.length&&st.hist[0].t<st.t-30)st.hist.shift();readout();graph()}}
 draw()}
function rideStress(k){
 if(k==='bus'){if(st.guests.length<130)rideAdd(st,20,'tour bus')}
 else if(k==='fire')rideAdd(st,-15,'fireworks');
 else if(k==='crew'||k==='long'){st[k]=!st[k];const b=document.querySelector(`[data-s="${k}"]`);if(b)b.setAttribute('aria-pressed',st[k]);
  st.marks.push({t:st.t,label:k==='crew'?(st.crew?'extra crew':'crew back to normal'):(st.long?'longer ride':'normal ride')})}}
function stress(i){if(RIDEMODE()){const it=RIDE_STRESS[i];if(it)rideStress(it[0]);return}
 const S=SYS[sys],it=S.stress[i];if(!it)return;eqChange(st,it[2],it[1].replace(/^\W+\s*/,'').replace(/\s*\(.*\)\s*$/,''))}
function setT(c){c=Math.max(0,Math.min(100,c));$('tSl').value=c;eqSetT(st,273+c);$('tOut').textContent=c+' °C';clearTimeout(setT.m);setT.m=setTimeout(()=>st.marks.push({t:st.t,label:c+' °C'}),250)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.sys){sys=b.dataset.sys;setup();return}
 if(b.dataset.s){if(RIDEMODE())rideStress(b.dataset.s);else stress(SYS[sys].stress.findIndex(x=>x[0]===b.dataset.s));return}
 if(b.dataset.sp){speed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
 if(b.dataset.r){const r=b.dataset.r;
  if(RIDEMODE()){st=rideFresh(r,{crew:st.crew,long:st.long});st.marks=[{t:0,label:r==='R'?'everyone in line':r==='P'?'everyone on the ride':'balanced'}]}
  else{const keep={V:st.V,T:st.T,cat:st.cat};st=r==='E'?fresh(null,keep):fresh(startFrom(r),keep);st.marks=[{t:0,label:r==='R'?'reactants only':r==='P'?'products only':'balanced'}]}
  lastSample=-1;status='';return}
 if(b.id==='catBtn'){st.cat=!st.cat;b.setAttribute('aria-pressed',st.cat);st.marks.push({t:st.t,label:st.cat?'catalyst on':'catalyst off'});return}
 if(b.id==='pauseBtn'){paused=!paused;b.setAttribute('aria-pressed',paused);b.textContent=paused?'▶ Play':'⏸ Pause';return}
 if(b.id==='fsBtn'){const d=document;if(d.fullscreenElement)d.exitFullscreen();else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(()=>{});return}});
$('tSl').addEventListener('input',e=>setT(+e.target.value));
$('vSl').addEventListener('input',e=>{const v=+e.target.value;eqSetV(st,v/100);$('vOut').textContent=v+'%';clearTimeout(setT.v);setT.v=setTimeout(()=>st.marks.push({t:st.t,label:'V '+v+'%'}),250)});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea')&&!/^[1-4]$/.test(e.key))return;if(e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.key===' '&&!e.target.closest('button')){e.preventDefault();$('pauseBtn').click()}
 else if(/^[1-4]$/.test(e.key))stress(+e.key-1);
 else if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&!RIDEMODE()&&SYS[sys].heat&&!e.target.closest('input')){e.preventDefault();setT(+$('tSl').value+(e.key==='ArrowRight'?10:-10))}
 else if(e.key==='r'||e.key==='R')document.querySelector('[data-r="E"]').click();
 else if(e.key==='f'||e.key==='F')$('fsBtn').click()});
if(!document.documentElement.requestFullscreen)$('fsBtn').hidden=true;
setup();last=performance.now();raf=requestAnimationFrame(loop);
window.PROJECTOR={state:()=>RIDEMODE()?({sys,paused,speed,n:counts(),guests:st.guests.length,t:st.t,crew:st.crew,long:st.long,f:st.ema.f,r:st.ema.r})
 :({sys,paused,speed,n:Object.assign({},st.n),parts:st.parts.length,t:st.t,cat:st.cat,T:st.T,V:st.V})};
})();
</script>
<script src="../../embed.js" defer></script>
