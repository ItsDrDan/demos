<style>
:root{--ink:#1f2a44;--muted:#4b566e;--line:#d9e1ec;--card:#fffefa;--fwd:#1f8a4c;--rev:#c25a12;--blue:#2c63c6}
*{box-sizing:border-box}html{-webkit-text-size-adjust:100%}
body{margin:0;font-family:Nunito,Inter,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:linear-gradient(120deg,#eef6ff,#fffaf2 55%,#fff1ee);min-height:100vh}
button,input{font:inherit;color:inherit}[hidden]{display:none!important}
:focus-visible{outline:4px solid #5b6fe0;outline-offset:3px}
.app{max-width:1800px;margin:0 auto;padding:12px 16px 20px;display:grid;gap:12px}
.top{display:flex;flex-wrap:wrap;align-items:center;gap:10px;justify-content:space-between}
.title{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.title h1{margin:0;font-family:Fredoka,Nunito,system-ui,sans-serif;font-weight:600;font-size:clamp(22px,2.2vw,34px)}
.title a{font-weight:800;color:var(--blue)}
.systems{display:flex;flex-wrap:wrap;gap:8px}
.sys{min-height:56px;padding:8px 18px;border-radius:16px;border:3px solid #c9d6e6;background:#fff;font-weight:900;font-size:clamp(16px,1.4vw,22px);cursor:pointer}
.sys[aria-pressed="true"]{background:#263840;color:#fff;border-color:#263840}
.eqline{font-size:clamp(24px,3vw,46px);font-weight:900;text-align:center;margin:0;letter-spacing:.01em}
.eqline .dh{display:inline-block;font-size:.5em;font-weight:800;color:var(--muted);margin-left:14px;vertical-align:middle}
.sw{display:inline-block;width:.7em;height:.7em;border-radius:50%;border:3px solid;vertical-align:.05em;margin-right:.15em}
.real{text-align:center;margin:-4px 0 0;color:var(--muted);font-size:clamp(15px,1.3vw,20px);font-weight:700}
.main{display:grid;grid-template-columns:minmax(0,2.2fr) minmax(280px,1fr);gap:14px;align-items:start}
.card{background:var(--card);border:1px solid var(--line);border-radius:22px;box-shadow:0 8px 22px #2a5a7a12;padding:12px}
.stage{position:relative}
canvas{display:block;width:100%;height:auto;border-radius:14px;background:#fafbff}
.stamp{position:absolute;left:18px;bottom:16px;font-weight:900;font-size:clamp(16px,1.4vw,22px);background:#ffffffd0;border-radius:10px;padding:2px 10px}
.side{display:grid;gap:12px}
.status{font-size:clamp(22px,2vw,32px);font-weight:900;text-align:center;padding:10px;border-radius:16px;background:#e9f6ee;color:#14603a}
.status.fwd{background:#e6f4ea;color:#155c35}.status.rev{background:#fdeee3;color:#8a3b08}
.rates,.counts{display:grid;gap:10px}
.rates h2,.counts h2,.graph h2{margin:0;font-size:clamp(16px,1.3vw,20px);color:var(--muted);font-weight:900;text-transform:uppercase;letter-spacing:.04em}
.bar{display:grid;grid-template-columns:minmax(90px,8em) 1fr 4.2em;align-items:center;gap:10px;font-weight:900;font-size:clamp(17px,1.5vw,24px)}
.track{height:clamp(22px,2.2vw,34px);background:#eef1f6;border-radius:999px;overflow:hidden}
.fill{height:100%;border-radius:999px;width:0;transition:width .25s linear}
.bar b{text-align:right;font-variant-numeric:tabular-nums}
.ctrls{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.big{min-height:64px;padding:10px 20px;border-radius:18px;border:3px solid #c9d6e6;background:#fff;font-weight:900;font-size:clamp(18px,1.6vw,26px);cursor:pointer;box-shadow:0 4px 0 #c9d6e6}
.big:active{transform:translateY(2px);box-shadow:0 2px 0 #c9d6e6}
.big.go{background:#2c63c6;border-color:#1d4691;color:#fff;box-shadow:0 4px 0 #1d4691}
.big[aria-pressed="true"]{background:#fff3c4;border-color:#d9a400;box-shadow:0 4px 0 #d9a400}
.slider{display:flex;align-items:center;gap:12px;font-weight:900;font-size:clamp(18px,1.6vw,26px);background:#fff;border:3px solid #c9d6e6;border-radius:18px;padding:6px 16px;min-height:64px;flex:1 1 320px}
.slider input{flex:1;min-width:120px;height:44px;accent-color:#2c63c6}
.slider input::-webkit-slider-thumb{width:36px;height:36px}
.slider output{min-width:4.2em;text-align:right;font-variant-numeric:tabular-nums}
.speed{display:flex;gap:6px}
.keys{color:var(--muted);font-size:14px;font-weight:700;margin:0}
.graph canvas{background:#fff}
@media (max-width:900px){.main{grid-template-columns:1fr}.big{min-height:52px;font-size:18px;padding:8px 14px}.slider{min-height:52px;font-size:18px}}
@media (prefers-reduced-motion:reduce){.fill{transition:none}}

<link rel="stylesheet" href="https://itsdrdan.github.io/games/brand/itsdrdan.css" media="print" onload="this.media='all'">
</head><body>
<main class="app" id="app">
 <div class="top">
  <div class="title"><h1>Equilibrium Projector</h1><a href="../../">← Demo Library</a></div>
  <div class="systems" role="group" aria-label="Choose a reaction" id="systems"></div>
 </div>
 <p class="eqline" id="eqline"></p>
 <p class="real" id="real"></p>
 <div class="main">
  <div class="card stage"><canvas id="cv" width="960" height="500" role="img" aria-label="Particle view of the reaction"></canvas><div class="stamp" id="stamp" aria-hidden="true"></div></div>
  <div class="side">
   <div class="status card" id="status" role="status" aria-live="polite">⚖️ Balanced</div>
   <div class="card rates"><h2>Reaction rates</h2>
    <div class="bar"><span>Forward</span><div class="track"><div class="fill" id="fF" style="background:var(--fwd)"></div></div><b id="fN">0</b></div>
    <div class="bar"><span>Reverse</span><div class="track"><div class="fill" id="fR" style="background:var(--rev)"></div></div><b id="rN">0</b></div></div>
   <div class="card counts" id="counts"><h2>Particles</h2></div>
   <div class="card graph"><h2>Amount over time (last 30 s)</h2><canvas id="gr" width="600" height="240" role="img" aria-label="Graph of the amount of each substance over the last 30 seconds"></canvas></div>
  </div>
 </div>
 <div class="ctrls" id="stress"></div>
 <div class="ctrls">
  <label class="slider" id="tWrap">🌡️ Temp<input type="range" id="tSl" min="0" max="100" step="1" value="25" aria-label="Temperature in degrees Celsius"><output id="tOut">25 °C</output></label>
  <label class="slider" id="vWrap">🫸 Volume<input type="range" id="vSl" min="35" max="100" step="1" value="70" aria-label="Volume of the container, percent"><output id="vOut">70%</output></label>
 </div>
 <div class="ctrls">
  <button type="button" class="big" id="catBtn" aria-pressed="false">⚡ Catalyst</button>
  <button type="button" class="big" id="pauseBtn" aria-pressed="false">⏸ Pause</button>
  <div class="speed" role="group" aria-label="Speed"><button type="button" class="big" data-sp="0.5" aria-pressed="false">½×</button><button type="button" class="big" data-sp="1" aria-pressed="true">1×</button><button type="button" class="big" data-sp="2" aria-pressed="false">2×</button></div>
  <button type="button" class="big" data-r="R">↺ Reactants only</button>
  <button type="button" class="big" data-r="P">↺ Products only</button>
  <button type="button" class="big" data-r="E">↺ Back to balance</button>
  <button type="button" class="big" id="fsBtn">⛶ Full screen</button>
 </div>
 <p class="keys">Keys: Space pause · 1–4 the change buttons · ← → temperature · R back to balance · F full screen</p>
</main>
<script>
/*@ENGINE@*/
/*@SHAPES@*/
(function(){
'use strict';
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ORDER=[['no2','N₂O₄ ⇌ NO₂'],['hi','H₂ + I₂ ⇌ HI'],['fescn','FeSCN²⁺ (blood-red)'],['hb','Hemoglobin + O₂'],['blood','Blood buffer']];
const W0=440,H0=250,DRAW=1.3;           // a smaller box than the game, drawn bigger: larger particles on a projector
let sys='no2',st=null,paused=false,speed=1,raf=0,last=0,lastSample=-1,status='',maxN=1;
try{const s=new URLSearchParams(location.search).get('sys');if(SYS[s])sys=s;}catch(e){}
const LW=()=>SYS[sys].gas?W0+40:W0;
function fresh(start,keep){const S=SYS[sys],o={W0,H:H0,V:keep?keep.V:(S.gas?0.7:1),T:keep?keep.T:EQ_T0,cat:keep?keep.cat:false};if(start)o.start=start;
 const s=eqNew(sys,o);if(!start){s.fast=true;eqRun(s,25,1/10);s.fast=false;}s.t=0;s.flashes=[];s.marks=[];s.hist=[];s.evF=s.evR=0;return s}
function startFrom(kind){const S=SYS[sys];let start={};
 if(kind==='R'){if(S.total)start={[S.R[0]]:S.total};else{S.R.forEach(k=>start[k]=(S.start[k]||0)+(S.start[S.P[0]]||0))}}
 else{if(S.total)start={[S.P[0]]:S.total*2};else{const n=Math.min(...S.R.map(k=>S.start[k]));start={[S.P[0]]:S.P.length===2?n*2:n};S.R.forEach(k=>{if(S.start[k]>n)start[k]=S.start[k]-n})}}
 return start}
function term([c,k,ph]){const S=SYS[sys],sh=SHAPES[k];return `${c>1?c+' ':''}${sh?`<span class="sw" style="background:${sh[0][3]};border-color:${sh[0][4]}"></span>`:''}${S.sp[k]?S.sp[k].l:{H2O:'H₂O'}[k]||k}(${ph})`}
function setup(){const S=SYS[sys];
 $('systems').innerHTML=ORDER.map(([k,l])=>`<button type="button" class="sys" data-sys="${k}" aria-pressed="${k===sys}">${l}</button>`).join('');
 const dh=S.dH==null?'':S.dH>0?`<span class="dh">ΔH &gt; 0 (endothermic)</span>`:`<span class="dh">ΔH &lt; 0 (exothermic)</span>`;
 $('eqline').innerHTML=`${S.eq.map(term).join(' + ')} ⇌ ${S.eqP.map(term).join(' + ')}${dh}`;
 $('real').textContent=S.real||'';
 $('stress').innerHTML=S.stress.map(([k,l],i)=>`<button type="button" class="big go" data-s="${k}" aria-keyshortcuts="${i+1}">${esc(l)}</button>`).join('');
 $('tWrap').hidden=!S.heat;$('vWrap').hidden=!S.gas;
 $('counts').innerHTML='<h2>Particles</h2>'+Object.keys(S.sp).map(k=>`<div class="bar"><span><span class="sw" style="background:${SHAPES[k][0][3]};border-color:${SHAPES[k][0][4]}"></span>${S.sp[k].l}</span><div class="track"><div class="fill" data-c="${k}" style="background:${SHAPES[k][0][4]}"></div></div><b data-n="${k}">0</b></div>`).join('');
 $('cv').setAttribute('aria-label','Particle view: '+S.title);
 st=fresh();maxN=1;status='';$('tSl').value=25;$('tOut').textContent='25 °C';$('vSl').value=70;$('vOut').textContent='70%';
 $('catBtn').setAttribute('aria-pressed','false');
 try{const u=new URL(location.href);u.searchParams.set('sys',sys);history.replaceState(null,'',u)}catch(e){}}
function fit(cv,w,h){const dpr=window.devicePixelRatio||1,cw=cv.clientWidth||w,want=Math.round(cw*dpr);if(cv.width!==want){cv.width=want;cv.height=Math.round(want*h/w)}const c=cv.getContext('2d');c.setTransform(cv.width/w,0,0,cv.height/h,0,0);return c}
function draw(){const S=SYS[sys],lw=LW(),cv=$('cv'),ctx=fit(cv,lw,H0),W=eqW(st);
 cv.style.aspectRatio=lw+'/'+H0;
 ctx.clearRect(0,0,lw,H0);const tc=st.T-273,warm=Math.max(0,Math.min(1,(tc-25)/75)),cold=Math.max(0,Math.min(1,(25-tc)/25));
 ctx.fillStyle=`rgb(${250-cold*20},${251-warm*12-cold*4},${255-warm*30})`;ctx.fillRect(0,0,W,H0);
 const tn=(st.x[S.tint.sp]??st.n[S.tint.sp])/st.V;let al,rgb;
 if(S.tint.mix){const f=Math.max(0,Math.min(1,(tn-S.tint.lo)/(S.tint.hi-S.tint.lo)));rgb=S.tint.mix[0].map((v,i)=>Math.round(v+(S.tint.mix[1][i]-v)*f));al=S.tint.a}else{rgb=S.tint.rgb;al=Math.min(S.tint.max,tn*S.tint.k)}
 ctx.fillStyle=`rgba(${rgb.join(',')},${al*0.45})`;ctx.fillRect(0,0,W,H0);
 if(S.gas){ctx.fillStyle='#dfe5ea';ctx.fillRect(W,0,lw-W,H0);ctx.fillStyle='#8696a3';ctx.fillRect(W,0,8,H0);ctx.fillRect(W+8,H0/2-6,lw-W,12)}
 for(const p of st.parts){const sh=SHAPES[p.s];p.a=(p.a??(p.x*7%6.28))+(paused?0:(p.vx>0?0.01:-0.01));const ca=Math.cos(p.a),sa=Math.sin(p.a);
  for(const [dx,dy,r,f,e] of sh){const x=p.x+(dx*ca-dy*sa)*DRAW,y=p.y+(dx*sa+dy*ca)*DRAW;ctx.beginPath();ctx.arc(x,y,r*DRAW,0,7);ctx.fillStyle=f;ctx.fill();ctx.lineWidth=1.8;ctx.strokeStyle=e;ctx.stroke()}}
 for(const f of st.flashes){const k=Math.max(0,Math.min(1,(st.t-f.t)/0.45));ctx.beginPath();ctx.arc(f.x,f.y,8+k*20,0,7);ctx.strokeStyle=f.dir>0?`rgba(31,138,76,${1-k})`:`rgba(194,90,18,${1-k})`;ctx.lineWidth=3.5;ctx.setLineDash(f.dir>0?[]:[6,5]);ctx.stroke();ctx.setLineDash([])}
 $('stamp').textContent=`${tc.toFixed(0)} °C${S.gas?' · V '+Math.round(st.V*100)+'%':''}${st.cat?' · catalyst on':''}${paused?' · paused':''}`}
function readout(){const S=SYS[sys],f=st.ema.f,r=st.ema.r,m=Math.max(f,r,0.5);
 $('fF').style.width=(100*f/m)+'%';$('fR').style.width=(100*r/m)+'%';$('fN').textContent=f.toFixed(1);$('rN').textContent=r.toFixed(1);
 for(const k in S.sp)maxN=Math.max(maxN,st.n[k]);
 for(const k in S.sp){const b=document.querySelector(`[data-n="${k}"]`),fl=document.querySelector(`[data-c="${k}"]`);if(b)b.textContent=st.n[k];if(fl)fl.style.width=(100*st.n[k]/maxN)+'%'}
 const bal=Math.abs(f-r)<0.12*Math.max(f,r)+0.08,want=bal?'eq':f>r?'fwd':'rev';
 if(want!==status){status=want;const el=$('status'),P=S.eqP.filter(e=>S.sp[e[1]]).map(e=>S.sp[e[1]].l).join(' + '),R=S.eq.filter(e=>S.sp[e[1]]).map(e=>S.sp[e[1]].l).join(' + ');
  el.className='status card '+want;el.textContent=want==='eq'?'⚖️ Balanced: forward = reverse':want==='fwd'?`➡️ Shifting forward, making ${P}`:`⬅️ Shifting back, making ${R}`}}
function graph(){const S=SYS[sys],cv=$('gr'),w=600,h=240,ctx=fit(cv,w,h),H=st.hist;ctx.clearRect(0,0,w,h);if(H.length<2)return;
 const ks=Object.keys(S.sp);let mx=1;for(const p of H)for(const k of ks)mx=Math.max(mx,p.c[k]);const t1=st.t,t0=t1-30,X=t=>(t-t0)/30*(w-20)+10,Y=v=>h-12-(v/mx)*(h-24);
 ctx.strokeStyle='#e3e8f0';ctx.lineWidth=1;for(let i=0;i<=4;i++){const y=12+i*(h-24)/4;ctx.beginPath();ctx.moveTo(10,y);ctx.lineTo(w-10,y);ctx.stroke()}
 let lastX=-1e9,row=0;for(const m of st.marks){if(m.t<t0)continue;const mx0=X(m.t);row=mx0-lastX<170?(row+1)%3:0;lastX=mx0;ctx.strokeStyle='#8a94a8';ctx.setLineDash([5,5]);ctx.beginPath();ctx.moveTo(X(m.t),8);ctx.lineTo(X(m.t),h-8);ctx.stroke();ctx.setLineDash([]);ctx.fillStyle='#4b566e';ctx.font='800 15px Nunito,system-ui,sans-serif';ctx.fillText(m.label,X(m.t)+5,22+row*18)}
 for(const k of ks){const e=SHAPES[k][0][4];ctx.strokeStyle=e==='#9c8456'?'#b49a62':e;ctx.lineWidth=4;ctx.beginPath();H.forEach((p,i)=>{const x=X(p.t),y=Y(p.c[k]);i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke()}}
function loop(now){raf=requestAnimationFrame(loop);if(document.hidden)return;const dt=Math.min(0.05,(now-last)/1000)*speed;last=now;
 if(!paused&&dt>0){eqStep(st,dt);if(st.t-lastSample>=0.2||lastSample<0){lastSample=st.t;const c={};for(const k in SYS[sys].sp)c[k]=st.x[k]/st.V;st.hist.push({t:st.t,c});while(st.hist.length&&st.hist[0].t<st.t-30)st.hist.shift();readout();graph()}}
 draw()}
function stress(i){const S=SYS[sys],it=S.stress[i];if(!it)return;eqChange(st,it[2],it[1].replace(/^\W+\s*/,'').replace(/\s*\(.*\)\s*$/,''))}
function setT(c){c=Math.max(0,Math.min(100,c));$('tSl').value=c;eqSetT(st,273+c);$('tOut').textContent=c+' °C';clearTimeout(setT.m);setT.m=setTimeout(()=>st.marks.push({t:st.t,label:c+' °C'}),250)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;
 if(b.dataset.sys){sys=b.dataset.sys;setup();return}
 if(b.dataset.s){stress(SYS[sys].stress.findIndex(x=>x[0]===b.dataset.s));return}
 if(b.dataset.sp){speed=+b.dataset.sp;document.querySelectorAll('[data-sp]').forEach(x=>x.setAttribute('aria-pressed',x===b));return}
 if(b.dataset.r){const keep={V:st.V,T:st.T,cat:st.cat};st=b.dataset.r==='E'?fresh(null,keep):fresh(startFrom(b.dataset.r),keep);lastSample=-1;st.marks=[{t:0,label:b.dataset.r==='R'?'reactants only':b.dataset.r==='P'?'products only':'balanced'}];status='';return}
 if(b.id==='catBtn'){st.cat=!st.cat;b.setAttribute('aria-pressed',st.cat);st.marks.push({t:st.t,label:st.cat?'catalyst on':'catalyst off'});return}
 if(b.id==='pauseBtn'){paused=!paused;b.setAttribute('aria-pressed',paused);b.textContent=paused?'▶ Play':'⏸ Pause';return}
 if(b.id==='fsBtn'){const d=document;if(d.fullscreenElement)d.exitFullscreen();else if(d.documentElement.requestFullscreen)d.documentElement.requestFullscreen().catch(()=>{});return}});
$('tSl').addEventListener('input',e=>setT(+e.target.value));
$('vSl').addEventListener('input',e=>{const v=+e.target.value;eqSetV(st,v/100);$('vOut').textContent=v+'%';clearTimeout(setT.v);setT.v=setTimeout(()=>st.marks.push({t:st.t,label:'V '+v+'%'}),250)});
document.addEventListener('keydown',e=>{if(e.target.closest('input,select,textarea')&&!/^[1-4]$/.test(e.key))return;if(e.altKey||e.ctrlKey||e.metaKey)return;
 if(e.key===' '&&!e.target.closest('button')){e.preventDefault();$('pauseBtn').click()}
 else if(/^[1-4]$/.test(e.key))stress(+e.key-1);
 else if((e.key==='ArrowRight'||e.key==='ArrowLeft')&&SYS[sys].heat&&!e.target.closest('input')){e.preventDefault();setT(+$('tSl').value+(e.key==='ArrowRight'?10:-10))}
 else if(e.key==='r'||e.key==='R')document.querySelector('[data-r="E"]').click();
 else if(e.key==='f'||e.key==='F')$('fsBtn').click()});
if(!document.documentElement.requestFullscreen)$('fsBtn').hidden=true;
setup();last=performance.now();raf=requestAnimationFrame(loop);
window.PROJECTOR={state:()=>({sys,paused,speed,n:Object.assign({},st.n),parts:st.parts.length,t:st.t,cat:st.cat,T:st.T,V:st.V})};
})();
</script>
